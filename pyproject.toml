[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-hunter"
version = "0.1.0"
description = "Time-safe emerging trend detection for Chinese game communities"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "jieba>=0.42.1,<1",
  "opencc-python-reimplemented>=0.1.7,<1",
  "openpyxl>=3.1,<4",
  "openai>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
